<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fleet Management - Swiss-Belhotel</title>

<!-- Swiss-Belhotel Favicon (SVG) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23c8102e'/><path d='M28 25 H72 V37 H42 V44 H68 V56 H42 V63 H72 V75 H28 Z' fill='%23ffffff'/></svg>">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --bg-main: #090a0f;
  --bg-card: #12151e;
  --bg-input: #0d0f17;
  --border-color: #222736;
  --border-active: #dc2626;
  --red-primary: #dc2626;
  --red-hover: #b91c1c;
  --red-glow: rgba(220, 38, 38, 0.35);
  --text-white: #f8fafc;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  --shadow-card: 0 12px 32px rgba(0, 0, 0, 0.4);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  font-family: var(--font-main);
  color: var(--text-white);
  background: var(--bg-main);
  background-image: 
    radial-gradient(circle at 50% 0%, rgba(220, 38, 38, 0.12) 0%, transparent 60%),
    radial-gradient(circle at 80% 100%, rgba(15, 23, 42, 0.6) 0%, transparent 50%);
  background-attachment: fixed;
  min-height: 100vh;
}

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: none; }

.wrap {
  width: min(100%, 480px);
  margin: auto;
  padding: 20px 16px 36px;
}

/* Gate Section */
.gate {
  min-height: 85vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.logo {
  width: min(100%, 310px);
  height: auto;
  margin-bottom: 20px;
}

.title {
  font-size: 26px;
  font-weight: 800;
  margin: 0 0 6px;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.muted { color: var(--text-muted); font-size: 13.5px; }

.label {
  display: block;
  text-align: left;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #cbd5e1;
}

.pin {
  width: 100%;
  border: 1.5px solid var(--border-color);
  border-radius: 18px;
  background: var(--bg-input);
  color: var(--text-white);
  padding: 16px;
  text-align: center;
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 0.3em;
  box-shadow: var(--shadow-card);
  transition: all 0.25s ease;
  -webkit-text-security: disc;
}

.pin:focus, input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--red-primary);
  box-shadow: 0 0 18px var(--red-glow);
}

/* Card Styling */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 22px;
  padding: 22px 18px;
  box-shadow: var(--shadow-card);
  backdrop-filter: blur(10px);
}

.hidden { display: none !important; }

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.pill {
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.vacant { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
.occupied { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }

.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.stat {
  background: #0d0f17;
  border: 1px solid #1e2330;
  border-radius: 16px;
  padding: 14px;
  font-size: 12px;
}

.stat b {
  display: block;
  margin-top: 6px;
  font-size: 16px;
  color: var(--text-white);
}

/* Form Styling */
.form { margin-top: 18px; }
.field { margin-bottom: 16px; }

.field input, .field textarea, .field select {
  width: 100%;
  border: 1.5px solid var(--border-color);
  border-radius: 14px;
  padding: 14px;
  background: var(--bg-input);
  color: var(--text-white);
  transition: all 0.2s ease;
}

.field select option {
  background: var(--bg-card);
  color: var(--text-white);
}

.primary {
  width: 100%;
  border: 0;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--red-primary), var(--red-hover));
  color: #fff;
  padding: 16px;
  font-weight: 800;
  font-size: 15px;
  letter-spacing: 0.02em;
  box-shadow: 0 6px 20px var(--red-glow);
  transition: all 0.2s ease;
}

.primary:active { transform: scale(0.98); }
.primary:disabled { opacity: 0.55; cursor: wait; }

.secondary {
  border: 1px solid var(--border-color);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-white);
  padding: 8px 14px;
  font-weight: 700;
  font-size: 13px;
  transition: all 0.2s ease;
}

.secondary:hover { background: rgba(255, 255, 255, 0.1); }

/* Messages */
.error { background: rgba(239, 68, 68, 0.12); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 14px; padding: 13px; font-size: 13.5px; }
.warning { background: rgba(245, 158, 11, 0.12); color: #fde047; border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 14px; padding: 13px; font-size: 13.5px; }
.success { background: rgba(34, 197, 94, 0.12); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.3); border-radius: 14px; padding: 13px; font-size: 13.5px; }

/* Steering Wheel Animated Loader */
.steer-loader {
  width: 56px;
  height: 56px;
  margin: 10px auto 16px;
  animation: steerTurn 2.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
}

@keyframes steerTurn {
  0% { transform: rotate(0deg); }
  30% { transform: rotate(120deg); }
  50% { transform: rotate(90deg); }
  80% { transform: rotate(-120deg); }
  100% { transform: rotate(0deg); }
}

.fade { animation: fade 0.35s ease both; }
@keyframes fade {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Modal */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  z-index: 999;
}

.modalbox {
  width: min(100%, 440px);
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 24px;
  padding: 24px 20px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.6);
}

.summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 18px;
}

.summary div {
  background: #0d0f17;
  border: 1px solid #1c202e;
  border-radius: 14px;
  padding: 12px;
}

.summary small { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
.summary b { display: block; margin-top: 4px; font-size: 14px; color: var(--text-white); }

.top { display: flex; justify-content: space-between; gap: 15px; align-items: center; margin-bottom: 18px; }
.status { margin: 15px 0; }
.server { font-size: 12.5px; margin-top: 10px; min-height: 18px; }
.footer { margin-top: 28px; text-align: center; font-size: 12px; color: var(--text-dim); letter-spacing: 0.05em; }
</style>
</head>
<body>
<main class="wrap">
<section id="gate" class="gate">
  <!-- Swiss-Belhotel Logo SVG -->
  <div class="logo">
    <svg viewBox="0 0 420 120" width="100%" aria-label="Swiss-Belhotel International Logo">
      <rect x="10" y="20" width="80" height="80" rx="16" fill="#c8102e"/>
      <path d="M30 40 H70 V50 H45 V55 H65 V65 H45 V70 H70 V80 H30 Z" fill="#ffffff"/>
      <text x="110" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="1">swiss-belhotel</text>
      <text x="110" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#dc2626" letter-spacing="3">INTERNATIONAL</text>
    </svg>
  </div>

  <h1 class="title">Fleet Management</h1>
  <p id="vehicleLabel" class="muted">Checking vehicle...</p>

  <div style="width:100%;margin-top:24px">
    <label class="label" for="pin">Enter 4 Digit License Plate</label>
    <input id="pin" type="password" class="pin" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="••••">
    <p id="pinMsg" class="muted" style="margin-top:10px">Enter 4 digits to continue</p>
    <div id="serverMsg" class="server"></div>
  </div>
</section>

<section id="app" class="hidden fade">
  <div class="top">
    <div>
      <div class="muted" style="font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:.14em;color:#dc2626">Fleet Vehicle</div>
      <h2 id="vehicleName" style="margin:4px 0;font-size:22px;font-weight:800">-</h2>
      <div id="plate" class="muted" style="font-weight:600">-</div>
    </div>
    <button id="refreshBtn" class="secondary">↻ Refresh</button>
  </div>

  <!-- Steering Wheel Loading State -->
  <div id="loading" class="card" style="text-align:center;padding:32px 18px">
    <div class="steer-loader">
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <circle cx="50" cy="50" r="42" stroke="#dc2626" stroke-width="8" fill="none"/>
        <circle cx="50" cy="50" r="12" fill="#dc2626"/>
        <circle cx="50" cy="50" r="5" fill="#ffffff"/>
        <path d="M50 16 L50 38 M18 68 L38 56 M82 68 L62 56" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </div>
    <p class="muted" style="margin:0;font-weight:500">Checking vehicle status...</p>
  </div>

  <div id="statusCard" class="card status hidden"></div>
  <div id="formArea"></div>
  <div id="appMsg" class="server"></div>

  <div class="footer">Tech SBYO Project 2026</div>
</section>
</main>

<div id="modal" class="modal hidden">
  <div class="modalbox fade">
    <div class="row">
      <h3 style="margin:0;font-size:20px;font-weight:800;color:#fff">Trip Summary</h3>
      <button class="secondary" style="border-radius:50%;width:36px;height:36px;padding:0;line-height:1" onclick="closeModal()">×</button>
    </div>
    <div id="summary" class="summary"></div>
    <button class="primary" style="margin-top:20px" onclick="closeModal()">Done</button>
  </div>
</div>

<script src="config.js"></script>
<script>
const CFG=window.FLEET_CONFIG||{};const API_URL=String(CFG.API_URL||'').replace(/\/$/,'');const TIMEOUT=Number(CFG.REQUEST_TIMEOUT_MS)||15000;const RETRIES=Number(CFG.MAX_RETRIES)||2;const params=new URLSearchParams(location.search);const plat=(params.get('plat')||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase();let vehicle=null;const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function rid(){return 'WEB-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function formatOdoInput(el){let v=el.value.replace(/\D/g,'');el.value=v?Number(v).toLocaleString('id-ID'):'';}
function parseOdoVal(v){return Number(String(v||'').replace(/\./g,'').replace(/,/g,'.'))}

async function request(url,opts={},retryable=true){let lastErr;for(let attempt=0;attempt<=RETRIES;attempt++){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),TIMEOUT);try{const res=await fetch(url,Object.assign({},opts,{signal:controller.signal,cache:'no-store'}));const text=await res.text();let data;try{data=JSON.parse(text)}catch(_){throw new Error('Server returned non-JSON response. Check Apps Script deployment and /exec URL.')}if(!res.ok||!data.ok&&data.error_code==='SERVER_ERROR')throw new Error(data.message||('HTTP '+res.status));return data}catch(e){lastErr=e;if(attempt<RETRIES&&retryable){await sleep(500*(attempt+1))}}finally{clearTimeout(timer)}}throw lastErr||new Error('Failed to contact server.')}
function get(action,extra={}){const q=new URLSearchParams(Object.assign({action,request_id:rid(),_t:Date.now()},extra));return request(API_URL+'?'+q.toString(),{},true)}
function post(payload){const body=Object.assign({},payload,{request_id:payload.request_id||rid()});return request(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(body)},true)}
function setMsg(text,type=''){const el=$('serverMsg');el.textContent=text;el.className='server '+type}function appMsg(text,type=''){const el=$('appMsg');el.textContent=text;el.className='server '+type}
async function init(){if(!API_URL||API_URL.includes('PASTE_')){setMsg('API is not configured. Fill API_URL in config.js.','warning');$('vehicleLabel').textContent='Configuration incomplete';return}if(!plat){$('vehicleLabel').textContent='Open the page via vehicle QR with plate parameter.';$('pin').disabled=true;setMsg('Example: index.html?plat=B1234ABC','warning');return}try{const h=await get('health');if(!h.ok)throw Error(h.message);setMsg('Server online • '+new Date(h.server_time).toLocaleTimeString('en-US'));const r=await get('vehicle',{plat});if(!r.ok)throw Error(r.message);vehicle=r.vehicle;$('vehicleLabel').textContent=vehicle.vehicle_name+' • '+vehicle.plate_number}catch(e){$('vehicleLabel').textContent='Cannot load vehicle';setMsg(e.message,'error');$('pin').disabled=true}}
$('pin').addEventListener('input',async e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);if(e.target.value.length!==4)return;if(!plat)return;setMsg('');$('pinMsg').textContent='Validating PIN...';try{const r=await post({action:'validatePin',plat,pin:e.target.value});if(!r.valid){e.target.value='';$('pinMsg').textContent='Incorrect PIN.';$('pinMsg').className='muted';setMsg('Invalid PIN.','error');return}$('gate').classList.add('hidden');$('app').classList.remove('hidden');loadStatus()}catch(err){e.target.value='';$('pinMsg').textContent='Enter 4 digits to continue';setMsg('Failed to contact server: '+err.message,'error')}});$('refreshBtn').onclick=()=>loadStatus();
async function loadStatus(){ $('loading').classList.remove('hidden');$('statusCard').classList.add('hidden');$('formArea').innerHTML='';appMsg('');try{const r=await get('status',{plat});if(!r.ok)throw Error(r.message);vehicle=r.vehicle;$('vehicleName').textContent=vehicle.vehicle_name;$('plate').textContent=vehicle.plate_number;const cls=vehicle.status==='Vacant'?'vacant':'occupied';$('statusCard').innerHTML='<div class="row"><b style="font-size:15px">Vehicle Status</b><span class="pill '+cls+'">'+esc(vehicle.status)+'</span></div><div class="grid2" style="margin-top:14px"><div class="stat"><span class="muted">Odometer</span><b>'+Number(vehicle.current_odo||0).toLocaleString('id-ID')+' km</b></div><div class="stat"><span class="muted">Fuel Ratio</span><b>'+vehicle.fuel_ratio+' km/L</b></div></div>';$('statusCard').classList.remove('hidden');vehicle.status==='Vacant'?renderCheckout():renderCheckin()}catch(e){$('formArea').innerHTML='<div class="error">'+esc(e.message)+'</div>'}finally{$('loading').classList.add('hidden')}}
function field(id,label,type='text',attrs=''){return '<div class="field"><label class="label" for="'+id+'">'+label+'</label><input id="'+id+'" type="'+type+'" '+attrs+'></div>'}
function renderCheckout(){$('formArea').innerHTML='<div class="card"><h3 style="margin:0;font-size:19px;font-weight:800;color:#fff">Check-Out / Start</h3><p class="muted" style="margin-top:4px;margin-bottom:18px">Fill in trip details before the vehicle is used.</p><form id="checkoutForm" class="form">'+field('driver','Driver Name')+'<div class="field"><label class="label" for="dept">Department</label><select id="dept" required><option value="" disabled selected>Select Department...</option><option value="Front Office">Front Office</option><option value="House Keeping">House Keeping</option><option value="Accounting">Accounting</option><option value="Executive Office">Executive Office</option><option value="HR &amp; Security">HR &amp; Security</option><option value="Sales &amp; Marketing">Sales &amp; Marketing</option><option value="Engineering">Engineering</option><option value="FBS">FBS</option><option value="FBP">FBP</option></select></div>'+field('destination','Destination')+'<div class="field"><label class="label">Purpose</label><textarea id="purpose" rows="3"></textarea></div>'+field('odoStart','Start Odo','text','inputmode="numeric" placeholder="e.g. 1.000.000" oninput="formatOdoInput(this)"')+'<button class="primary">Start Trip</button></form></div>';$('checkoutForm').onsubmit=e=>{e.preventDefault();checkout()}}
async function checkout(){const payload={action:'checkout',plat,driver_name:$('driver').value.trim(),department:$('dept').value.trim(),destination:$('destination').value.trim(),purpose:$('purpose').value.trim(),odo_start:parseOdoVal($('odoStart').value),request_id:rid()};if(!payload.driver_name||!payload.department||!payload.destination||!payload.purpose||!Number.isFinite(payload.odo_start)){appMsg('Complete all fields.','error');return}const btn=document.querySelector('#checkoutForm button');btn.disabled=true;btn.textContent='Saving...';try{const r=await post(payload);if(!r.ok)throw Error(r.message);appMsg('Check-Out successful.','success');await loadStatus()}catch(e){appMsg('Check-Out failed: '+e.message,'error');btn.disabled=false;btn.textContent='Start Trip'}}
function renderCheckin(){const trip=vehicle.current_trip||{};$('formArea').innerHTML='<div class="card"><h3 style="margin:0;font-size:19px;font-weight:800;color:#fff">Check-In / Finish</h3><p class="muted" style="margin-top:4px;margin-bottom:18px">Enter final odometer to finish the trip.</p><div class="stat" style="margin:15px 0">Driver: <b>'+esc(trip.driver_name||'-')+'</b>Start Odo: <b>'+Number(trip.odo_start||0).toLocaleString('id-ID')+' km</b></div><form id="checkinForm">'+field('odoEnd','End Odo','text','inputmode="numeric" placeholder="e.g. 1.000.000" oninput="formatOdoInput(this)"')+'<button class="primary">Finish Trip</button></form></div>';$('checkinForm').onsubmit=e=>{e.preventDefault();checkin()}}
async function checkin(){const odoEnd=parseOdoVal($('odoEnd').value),start=Number(vehicle.current_trip?.odo_start||0);if(!Number.isFinite(odoEnd)||odoEnd<start){appMsg('End Odo must be ≥ '+start.toLocaleString('id-ID')+'.','error');return}const btn=document.querySelector('#checkinForm button');btn.disabled=true;btn.textContent='Calculating...';try{const r=await post({action:'checkin',plat,odo_end:odoEnd,request_id:rid()});if(!r.ok)throw Error(r.message);showSummary(r.trip);await loadStatus()}catch(e){appMsg('Check-In failed: '+e.message,'error');btn.disabled=false;btn.textContent='Finish Trip'}}
function showSummary(t){$('summary').innerHTML=[['Driver',t.driver_name],['Destination',t.destination],['Distance',(Number(t.distance_km)||0)+' km'],['Fuel',(Number(t.fuel_used_liter)||0)+' L'],['Fuel Price',money(t.fuel_price)],['Estimated Cost',money(t.estimated_fuel_cost)]].map(x=>'<div><small>'+esc(x[0])+'</small><b>'+esc(x[1])+'</b></div>').join('');$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}init();
</script>
</body>
</html>
