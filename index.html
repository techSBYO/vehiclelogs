<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fleet Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:#f5f7fb}.glass{backdrop-filter:blur(18px);background:rgba(255,255,255,.86)}
  .fade-in{animation:fade .35s ease both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  input,select,textarea{outline:none} .pin{letter-spacing:.35em}
</style>
</head>
<body class="min-h-screen text-slate-900">
<main class="mx-auto min-h-screen max-w-md px-5 py-8">
  <section id="gate" class="flex min-h-[88vh] flex-col items-center justify-center text-center">
    <div class="mb-8 flex h-24 w-full items-center justify-center">
<svg viewBox="0 0 520 180" role="img" aria-label="Company Logo" class="h-24 w-auto max-w-[80vw]"><rect width="520" height="180" rx="32" fill="#f1f5f9"/><rect x="20" y="20" width="140" height="140" rx="28" fill="#0f172a"/><text x="90" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="white">LOGO</text><text x="190" y="103" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">COMPANY LOGO</text></svg></div>
    <h1 class="text-2xl font-bold">Fleet Management</h1>
    <p id="vehicleLabel" class="mt-2 text-sm text-slate-500">Memuat kendaraan...</p>
    <div class="mt-8 w-full">
      <label class="text-sm font-medium">Masukkan 4 Digit Angka Plat Nomor</label>
      <input id="pin" inputmode="numeric" maxlength="4" autocomplete="one-time-code"
        class="pin mt-3 w-full rounded-2xl border border-slate-200 bg-white px-5 py-4 text-center text-3xl font-semibold shadow-sm focus:border-slate-400"
        placeholder="••••" aria-label="PIN 4 digit">
      <p id="pinMsg" class="mt-3 min-h-5 text-sm text-slate-500">Masukkan 4 digit untuk melanjutkan</p>
    </div>
  </section>

  <section id="app" class="hidden fade-in pb-10">
    <header class="mb-6 flex items-center justify-between">
      <div>
        <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Fleet Vehicle</p>
        <h2 id="vehicleName" class="text-xl font-bold">-</h2>
        <p id="plate" class="text-sm text-slate-500">-</p>
      </div>
      <button id="refreshBtn" class="rounded-full bg-white px-4 py-2 text-sm font-semibold shadow-sm">↻ Refresh</button>
    </header>

    <div id="loading" class="glass rounded-3xl p-6 text-center shadow-sm">
      <div class="mx-auto h-8 w-8 animate-spin rounded-full border-4 border-slate-200 border-t-slate-800"></div>
      <p class="mt-3 text-sm text-slate-500">Mengecek status kendaraan...</p>
    </div>

    <div id="statusCard" class="hidden glass mb-5 rounded-3xl p-5 shadow-sm"></div>
    <div id="formArea"></div>
  </section>
</main>

<div id="modal" class="fixed inset-0 z-50 hidden items-end justify-center bg-slate-950/40 p-4 sm:items-center">
  <div class="w-full max-w-md rounded-3xl bg-white p-6 shadow-2xl fade-in">
    <div class="flex items-center justify-between"><h3 class="text-xl font-bold">Summary Perjalanan</h3><button onclick="closeModal()" class="text-2xl text-slate-400">×</button></div>
    <div id="summary" class="mt-5 space-y-3"></div>
    <button onclick="closeModal()" class="mt-6 w-full rounded-2xl bg-slate-900 py-3.5 font-semibold text-white">Selesai</button>
  </div>
</div>

<script src="config.js"></script>
<script>
const API_URL = window.FLEET_CONFIG?.API_URL || "";
const params = new URLSearchParams(location.search);
const plat = (params.get("plat") || "").replace(/[^A-Za-z0-9]/g,"").toUpperCase();
let vehicle = null;

const $ = id => document.getElementById(id);
function apiGet(action){
  return fetch(`${API_URL}?action=${encodeURIComponent(action)}&plat=${encodeURIComponent(plat)}`).then(r=>r.json());
}
function apiPost(payload){
  return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}).then(r=>r.json());
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function money(n){return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);}
function showError(msg){$("pinMsg").textContent=msg;$("pinMsg").className="mt-3 min-h-5 text-sm text-red-500";}

async function init(){
  if(!plat){$("vehicleLabel").textContent="Silakan buka melalui QR Code kendaraan (parameter plat diperlukan)."; return;}
  try{
    const r=await apiGet("vehicle");
    if(!r.ok) throw new Error(r.message);
    vehicle=r.vehicle;
    $("vehicleLabel").textContent=`${vehicle.vehicle_name} • ${vehicle.plate_number}`;
  }catch(e){$("vehicleLabel").textContent="Kendaraan tidak ditemukan."; $("pin").disabled=true;}
}
$("pin").addEventListener("input", async e=>{
  e.target.value=e.target.value.replace(/\D/g,"").slice(0,4);
  if(e.target.value.length!==4) return;
  if(!plat){ e.target.value=""; $("pinMsg").textContent="URL belum memiliki parameter plat. Gunakan QR Code kendaraan."; $("pinMsg").className="mt-3 min-h-5 text-sm text-amber-600"; return; }
  $("pinMsg").textContent="Memvalidasi...";
  try{
    const r=await apiPost({action:"validatePin",plat,pin:e.target.value});
    if(!r.ok){e.target.value="";return showError(r.message||"PIN tidak valid");}
    $("gate").classList.add("hidden"); $("app").classList.remove("hidden"); loadStatus();
  }catch(err){e.target.value="";showError("Gagal menghubungi server.");}
});
$("refreshBtn").onclick=loadStatus;

async function loadStatus(){
  $("loading").classList.remove("hidden");$("statusCard").classList.add("hidden");$("formArea").innerHTML="";
  try{
    const r=await apiGet("status"); if(!r.ok) throw new Error(r.message);
    vehicle=r.vehicle;
    $("vehicleName").textContent=vehicle.vehicle_name;
    $("plate").textContent=vehicle.plate_number;
    $("statusCard").innerHTML=`<div class="flex items-center justify-between"><span class="font-semibold">Status Kendaraan</span><span class="rounded-full px-3 py-1 text-xs font-bold ${vehicle.status==="Vacant"?"bg-emerald-100 text-emerald-700":"bg-amber-100 text-amber-700"}">${esc(vehicle.status)}</span></div>
      <div class="mt-4 grid grid-cols-2 gap-3 text-sm"><div class="rounded-2xl bg-slate-50 p-3"><span class="text-slate-400">Odometer</span><br><b>${Number(vehicle.current_odo||0).toLocaleString("id-ID")} km</b></div><div class="rounded-2xl bg-slate-50 p-3"><span class="text-slate-400">Rasio BBM</span><br><b>${vehicle.fuel_ratio} km/L</b></div></div>`;
    $("statusCard").classList.remove("hidden");
    vehicle.status==="Vacant"?renderCheckout():renderCheckin();
  }catch(e){$("formArea").innerHTML=`<div class="rounded-2xl bg-red-50 p-4 text-sm text-red-700">${esc(e.message)}</div>`}
  finally{$("loading").classList.add("hidden")}
}
function field(id,label,type="text",extra=""){
 return `<label class="block text-sm font-medium">${label}<input id="${id}" type="${type}" ${extra} class="mt-2 w-full rounded-2xl border border-slate-200 bg-white px-4 py-3.5 shadow-sm"></label>`;
}
function renderCheckout(){
 $("formArea").innerHTML=`<div class="rounded-3xl bg-white p-5 shadow-sm"><h3 class="text-lg font-bold">Check-Out / Mulai</h3><p class="mt-1 mb-5 text-sm text-slate-500">Isi data perjalanan sebelum kendaraan digunakan.</p>
 <form id="checkoutForm" class="space-y-4">
 ${field("driver","Nama Driver")}
 ${field("dept","Departemen")}
 ${field("destination","Destinasi")}
 <label class="block text-sm font-medium">Keperluan<textarea id="purpose" rows="3" class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3.5"></textarea></label>
 ${field("odoStart","Odo Awal","number","min=\"0\" step=\"0.1\"")}
 <button class="w-full rounded-2xl bg-slate-900 py-4 font-semibold text-white">Mulai Perjalanan</button></form></div>`;
 $("checkoutForm").onsubmit=async e=>{e.preventDefault();await checkout()};
}
async function checkout(){
 const payload={action:"checkout",plat,driver_name:$("driver").value.trim(),department:$("dept").value.trim(),destination:$("destination").value.trim(),purpose:$("purpose").value.trim(),odo_start:Number($("odoStart").value)};
 if(!payload.driver_name||!payload.department||!payload.destination||!payload.purpose||!Number.isFinite(payload.odo_start))return alert("Lengkapi semua data.");
 const btn=document.querySelector("#checkoutForm button");btn.disabled=true;btn.textContent="Menyimpan...";
 try{const r=await apiPost(payload);if(!r.ok)throw new Error(r.message);alert("Check-Out berhasil. Kendaraan sekarang Occupied.");loadStatus()}catch(e){alert(e.message);btn.disabled=false;btn.textContent="Mulai Perjalanan"}
}
function renderCheckin(){
 $("formArea").innerHTML=`<div class="rounded-3xl bg-white p-5 shadow-sm"><h3 class="text-lg font-bold">Check-In / Selesai</h3><p class="mt-1 mb-5 text-sm text-slate-500">Masukkan odometer akhir untuk menyelesaikan perjalanan.</p>
 <div class="mb-4 rounded-2xl bg-slate-50 p-4 text-sm">Driver: <b>${esc(vehicle.current_trip?.driver_name||"-")}</b><br>Odo Awal: <b>${Number(vehicle.current_trip?.odo_start||0).toLocaleString("id-ID")} km</b></div>
 <form id="checkinForm" class="space-y-4">${field("odoEnd","Odo Akhir","number","min=\"0\" step=\"0.1\"")}<button class="w-full rounded-2xl bg-slate-900 py-4 font-semibold text-white">Selesaikan Perjalanan</button></form></div>`;
 $("checkinForm").onsubmit=async e=>{e.preventDefault();await checkin()};
}
async function checkin(){
 const odoEnd=Number($("odoEnd").value), start=Number(vehicle.current_trip?.odo_start||0);
 if(!Number.isFinite(odoEnd)||odoEnd<start)return alert(`Odo akhir harus ≥ ${start}.`);
 const btn=document.querySelector("#checkinForm button");btn.disabled=true;btn.textContent="Menghitung...";
 try{const r=await apiPost({action:"checkin",plat,odo_end:odoEnd});if(!r.ok)throw new Error(r.message);showSummary(r.trip);loadStatus()}catch(e){alert(e.message);btn.disabled=false;btn.textContent="Selesaikan Perjalanan"}
}
function showSummary(t){
 $("summary").innerHTML=`<div class="grid grid-cols-2 gap-3">${[
 ["Driver",t.driver_name],["Destinasi",t.destination],["Jarak",`${t.distance_km} km`],["BBM",`${t.fuel_used_liter} L`],["Harga BBM",money(t.fuel_price)],["Estimasi Biaya",money(t.estimated_fuel_cost)]
 ].map(x=>`<div class="rounded-2xl bg-slate-50 p-3"><div class="text-xs text-slate-400">${esc(x[0])}</div><div class="mt-1 font-semibold">${esc(x[1])}</div></div>`).join("")}</div>`;
 $("modal").classList.remove("hidden");$("modal").classList.add("flex");
}
function closeModal(){$("modal").classList.add("hidden");$("modal").classList.remove("flex")}
init();
</script>
</body></html>
