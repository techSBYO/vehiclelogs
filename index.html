<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fleet Management</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:#f5f7fb}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{width:min(100%,520px);margin:auto;padding:24px 20px}.gate{min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.logo{width:min(100%,320px);height:105px;display:flex;align-items:center;justify-content:center;margin-bottom:24px}.title{font-size:28px;font-weight:800;margin:0}.muted{color:#64748b;font-size:14px}.label{display:block;text-align:left;font-size:14px;font-weight:700;margin-bottom:7px}.pin{width:100%;border:1px solid #e2e8f0;border-radius:18px;background:#fff;padding:16px;text-align:center;font-size:30px;letter-spacing:.35em;box-shadow:0 4px 18px #0f172a0d}.pin:focus,input:focus,textarea:focus,select:focus{outline:2px solid #94a3b8;outline-offset:1px}.card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 8px 28px #0f172a0d}.hidden{display:none!important}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800}.vacant{background:#dcfce7;color:#15803d}.occupied{background:#fef3c7;color:#b45309}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#f8fafc;border-radius:16px;padding:13px;font-size:13px}.stat b{display:block;margin-top:4px;font-size:15px}.form{margin-top:18px}.field{margin-bottom:15px}.field input,.field textarea,.field select{width:100%;border:1px solid #e2e8f0;border-radius:16px;padding:13px;background:#fff}.primary{width:100%;border:0;border-radius:16px;background:#0f172a;color:#fff;padding:14px;font-weight:800}.primary:disabled{opacity:.55;cursor:wait}.secondary{border:0;border-radius:14px;background:#fff;padding:10px 13px;font-weight:700;box-shadow:0 3px 15px #0f172a0d}.error{background:#fef2f2;color:#b91c1c;border-radius:16px;padding:13px;font-size:14px}.warning{background:#fffbeb;color:#a16207;border-radius:16px;padding:13px;font-size:14px}.success{background:#ecfdf5;color:#047857;border-radius:16px;padding:13px;font-size:14px}.spinner{width:28px;height:28px;border:4px solid #e2e8f0;border-top-color:#0f172a;border-radius:50%;animation:spin .8s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}.fade{animation:fade .3s ease both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.modal{position:fixed;inset:0;background:#02061766;display:flex;align-items:center;justify-content:center;padding:18px}.modalbox{width:min(100%,460px);background:#fff;border-radius:24px;padding:22px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.summary div{background:#f8fafc;border-radius:15px;padding:12px}.summary small{color:#64748b}.summary b{display:block;margin-top:3px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.status{margin:15px 0}.server{font-size:12px;margin-top:10px;min-height:17px}.footer{margin-top:22px;text-align:center;font-size:12px;color:#94a3b8}
</style>
</head>
<body>
<main class="wrap">
<section id="gate" class="gate">
<div class="logo"><svg viewBox="0 0 520 180" width="320" aria-label="Company Logo"><rect width="520" height="180" rx="32" fill="#f1f5f9"/><rect x="20" y="20" width="140" height="140" rx="28" fill="#0f172a"/><text x="90" y="111" text-anchor="middle" font-family="Arial" font-size="48" font-weight="700" fill="white">LOGO</text><text x="190" y="103" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">COMPANY LOGO</text></svg></div>
<h1 class="title">Fleet Management</h1><p id="vehicleLabel" class="muted">Checking vehicle...</p>
<div style="width:100%;margin-top:30px"><label class="label" for="pin">Enter 4 Digit License Plate Number</label><input id="pin" class="pin" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="••••"><p id="pinMsg" class="muted">Enter 4 digits to continue</p><div id="serverMsg" class="server"></div></div>
</section>
<section id="app" class="hidden fade">
<div class="top"><div><div class="muted" style="font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:.14em">Fleet Vehicle</div><h2 id="vehicleName" style="margin:4px 0;font-size:21px">-</h2><div id="plate" class="muted">-</div></div><button id="refreshBtn" class="secondary">↻ Refresh</button></div>
<div id="loading" class="card" style="text-align:center"><div class="spinner"></div><p class="muted">Checking vehicle status...</p></div>
<div id="statusCard" class="card status hidden"></div><div id="formArea"></div><div id="appMsg" class="server"></div>
<div class="footer">Fleet Management API v3</div>
</section>
</main>
<div id="modal" class="modal hidden"><div class="modalbox fade"><div class="row"><h3 style="margin:0;font-size:20px">Trip Summary</h3><button class="secondary" onclick="closeModal()">×</button></div><div id="summary" class="summary"></div><button class="primary" style="margin-top:16px" onclick="closeModal()">Done</button></div></div>
<script src="config.js"></script>
<script>
const CFG=window.FLEET_CONFIG||{};const API_URL=String(CFG.API_URL||'').replace(/\/$/,'');const TIMEOUT=Number(CFG.REQUEST_TIMEOUT_MS)||15000;const RETRIES=Number(CFG.MAX_RETRIES)||2;const params=new URLSearchParams(location.search);const plat=(params.get('plat')||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase();let vehicle=null;const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function rid(){return 'WEB-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
async function request(url,opts={},retryable=true){let lastErr;for(let attempt=0;attempt<=RETRIES;attempt++){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),TIMEOUT);try{const res=await fetch(url,Object.assign({},opts,{signal:controller.signal,cache:'no-store'}));const text=await res.text();let data;try{data=JSON.parse(text)}catch(_){throw new Error('Server returned non-JSON response. Check Apps Script deployment and /exec URL.')}if(!res.ok||!data.ok&&data.error_code==='SERVER_ERROR')throw new Error(data.message||('HTTP '+res.status));return data}catch(e){lastErr=e;if(attempt<RETRIES&&retryable){await sleep(500*(attempt+1))}}finally{clearTimeout(timer)}}throw lastErr||new Error('Failed to contact server.')}
function get(action,extra={}){const q=new URLSearchParams(Object.assign({action,request_id:rid(),_t:Date.now()},extra));return request(API_URL+'?'+q.toString(),{},true)}
function post(payload){const body=Object.assign({},payload,{request_id:payload.request_id||rid()});return request(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(body)},true)}
function setMsg(text,type=''){const el=$('serverMsg');el.textContent=text;el.className='server '+type}function appMsg(text,type=''){const el=$('appMsg');el.textContent=text;el.className='server '+type}
async function init(){if(!API_URL||API_URL.includes('PASTE_')){setMsg('API is not configured. Fill API_URL in config.js.','warning');$('vehicleLabel').textContent='Configuration incomplete';return}if(!plat){$('vehicleLabel').textContent='Open the page via vehicle QR with plate parameter.';$('pin').disabled=true;setMsg('Example: index.html?plat=B1234ABC','warning');return}try{const h=await get('health');if(!h.ok)throw Error(h.message);setMsg('Server online • '+new Date(h.server_time).toLocaleTimeString('en-US'));const r=await get('vehicle',{plat});if(!r.ok)throw Error(r.message);vehicle=r.vehicle;$('vehicleLabel').textContent=vehicle.vehicle_name+' • '+vehicle.plate_number}catch(e){$('vehicleLabel').textContent='Cannot load vehicle';setMsg(e.message,'error');$('pin').disabled=true}}
$('pin').addEventListener('input',async e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);if(e.target.value.length!==4)return;if(!plat)return;setMsg('');$('pinMsg').textContent='Validating PIN...';try{const r=await post({action:'validatePin',plat,pin:e.target.value});if(!r.valid){e.target.value='';$('pinMsg').textContent='Incorrect PIN.';$('pinMsg').className='muted';setMsg('Invalid PIN.','error');return}$('gate').classList.add('hidden');$('app').classList.remove('hidden');loadStatus()}catch(err){e.target.value='';setMsg('Failed to contact server: '+err.message,'error')}});$('refreshBtn').onclick=()=>loadStatus();
async function loadStatus(){ $('loading').classList.remove('hidden');$('statusCard').classList.add('hidden');$('formArea').innerHTML='';appMsg('');try{const r=await get('status',{plat});if(!r.ok)throw Error(r.message);vehicle=r.vehicle;$('vehicleName').textContent=vehicle.vehicle_name;$('plate').textContent=vehicle.plate_number;const cls=vehicle.status==='Vacant'?'vacant':'occupied';$('statusCard').innerHTML='<div class="row"><b>Vehicle Status</b><span class="pill '+cls+'">'+esc(vehicle.status)+'</span></div><div class="grid2" style="margin-top:14px"><div class="stat"><span class="muted">Odometer</span><b>'+Number(vehicle.current_odo||0).toLocaleString('id-ID')+' km</b></div><div class="stat"><span class="muted">Fuel Ratio</span><b>'+vehicle.fuel_ratio+' km/L</b></div></div>';$('statusCard').classList.remove('hidden');vehicle.status==='Vacant'?renderCheckout():renderCheckin()}catch(e){$('formArea').innerHTML='<div class="error">'+esc(e.message)+'</div>'}finally{$('loading').classList.add('hidden')}}
function field(id,label,type='text',attrs=''){return '<div class="field"><label class="label" for="'+id+'">'+label+'</label><input id="'+id+'" type="'+type+'" '+attrs+'></div>'}
function renderCheckout(){$('formArea').innerHTML='<div class="card"><h3 style="margin:0;font-size:19px">Check-Out / Start</h3><p class="muted">Fill in trip details before the vehicle is used.</p><form id="checkoutForm" class="form">'+field('driver','Driver Name')+'<div class="field"><label class="label" for="dept">Department</label><select id="dept" required><option value="" disabled selected>Select Department...</option><option value="Front Office">Front Office</option><option value="House Keeping">House Keeping</option><option value="Accounting">Accounting</option><option value="Executive Office">Executive Office</option><option value="HR &amp; Security">HR &amp; Security</option><option value="Sales &amp; Marketing">Sales &amp; Marketing</option><option value="Engineering">Engineering</option><option value="FBS">FBS</option><option value="FBP">FBP</option></select></div>'+field('destination','Destination')+'<div class="field"><label class="label">Purpose</label><textarea id="purpose" rows="3"></textarea></div>'+field('odoStart','Start Odo','number','min="0" step="0.1"')+'<button class="primary">Start Trip</button></form></div>';$('checkoutForm').onsubmit=e=>{e.preventDefault();checkout()}}
async function checkout(){const payload={action:'checkout',plat,driver_name:$('driver').value.trim(),department:$('dept').value.trim(),destination:$('destination').value.trim(),purpose:$('purpose').value.trim(),odo_start:Number($('odoStart').value),request_id:rid()};if(!payload.driver_name||!payload.department||!payload.destination||!payload.purpose||!Number.isFinite(payload.odo_start)){appMsg('Complete all fields.','error');return}const btn=document.querySelector('#checkoutForm button');btn.disabled=true;btn.textContent='Saving...';try{const r=await post(payload);if(!r.ok)throw Error(r.message);appMsg('Check-Out successful.','success');await loadStatus()}catch(e){appMsg('Check-Out failed: '+e.message,'error');btn.disabled=false;btn.textContent='Start Trip'}}
function renderCheckin(){const trip=vehicle.current_trip||{};$('formArea').innerHTML='<div class="card"><h3 style="margin:0;font-size:19px">Check-In / Finish</h3><p class="muted">Enter final odometer to finish the trip.</p><div class="stat" style="margin:15px 0">Driver: <b>'+esc(trip.driver_name||'-')+'</b>Start Odo: <b>'+Number(trip.odo_start||0).toLocaleString('id-ID')+' km</b></div><form id="checkinForm">'+field('odoEnd','End Odo','number','min="'+Number(trip.odo_start||0)+'" step="0.1"')+'<button class="primary">Finish Trip</button></form></div>';$('checkinForm').onsubmit=e=>{e.preventDefault();checkin()}}
async function checkin(){const odoEnd=Number($('odoEnd').value),start=Number(vehicle.current_trip?.odo_start||0);if(!Number.isFinite(odoEnd)||odoEnd<start){appMsg('End Odo must be ≥ '+start+'.','error');return}const btn=document.querySelector('#checkinForm button');btn.disabled=true;btn.textContent='Calculating...';try{const r=await post({action:'checkin',plat,odo_end:odoEnd,request_id:rid()});if(!r.ok)throw Error(r.message);showSummary(r.trip);await loadStatus()}catch(e){appMsg('Check-In failed: '+e.message,'error');btn.disabled=false;btn.textContent='Finish Trip'}}
function showSummary(t){$('summary').innerHTML=[['Driver',t.driver_name],['Destination',t.destination],['Distance',(Number(t.distance_km)||0)+' km'],['Fuel',(Number(t.fuel_used_liter)||0)+' L'],['Fuel Price',money(t.fuel_price)],['Estimated Cost',money(t.estimated_fuel_cost)]].map(x=>'<div><small>'+esc(x[0])+'</small><b>'+esc(x[1])+'</b></div>').join('');$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}init();
</script></body></html>
