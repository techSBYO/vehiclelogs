<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fleet Dashboard</title>

<!-- Favicon -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">

<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background-color: #0b0f17; color: #f1f5f9; }
  .fade { animation: f .35s ease both; }
  @keyframes f { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .th-sort { cursor: pointer; user-select: none; transition: color 0.2s; }
  .th-sort:hover { color: #ef4444; }
</style>
</head>
<body class="min-h-screen font-sans text-slate-100 antialiased">
<div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">

<!-- Header -->
<header class="mb-7 flex flex-wrap items-center justify-between gap-4">
  <div>
    <p class="text-xs font-bold uppercase tracking-widest text-red-500">Fleet Vehicle</p>
    <h1 class="text-3xl font-bold text-white">Fleet Dashboard</h1>
    <p class="mt-1 text-sm text-slate-400">Monitoring kendaraan dan log perjalanan secara real-time.</p>
  </div>
  <button onclick="loadDashboard()" class="flex items-center gap-2 rounded-2xl bg-[#161d2a] border border-slate-800 px-4 py-2.5 text-sm font-semibold text-slate-200 shadow-md hover:bg-[#1f293a] transition">
    <span>↻</span> Refresh
  </button>
</header>

<div id="message"></div>

<!-- KPI Cards -->
<section id="kpis" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4"></section>

<!-- Middle Section: Vehicle Status & Today Summary -->
<section class="mt-6 grid gap-6 lg:grid-cols-2">
  <div class="rounded-3xl border border-slate-800/80 bg-[#131926] p-5 shadow-xl">
    <div class="mb-4 flex items-center justify-between">
      <h2 class="text-lg font-bold text-white">Vehicle Status</h2>
      <span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-0.5 text-xs font-medium text-emerald-400">
        <span class="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Live
      </span>
    </div>
    <div id="vehicles" class="space-y-3"></div>
  </div>

  <div class="rounded-3xl border border-slate-800/80 bg-[#131926] p-5 shadow-xl">
    <h2 class="mb-4 text-lg font-bold text-white">Today's Summary</h2>
    <div id="today" class="space-y-3"></div>
  </div>
</section>

<!-- Recent Trips Table dengan Sortable Headers -->
<section class="mt-6 rounded-3xl border border-slate-800/80 bg-[#131926] p-5 shadow-xl">
  <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 class="text-lg font-bold text-white">Recent Trip Logs</h2>
      <p class="text-xs text-slate-400 mt-0.5">Klik judul kolom untuk mengurutkan (sort) data.</p>
    </div>
    <input id="search" oninput="filterTrips()" placeholder="Cari driver / kendaraan..." class="w-full sm:w-64 rounded-2xl border border-slate-800 bg-[#0b0f17] px-4 py-2 text-sm text-slate-100 placeholder-slate-500 focus:border-red-500 focus:outline-none focus:ring-1 focus:ring-red-500 transition">
  </div>

  <div class="overflow-x-auto">
    <table class="min-w-full text-left text-sm">
      <thead>
        <tr class="border-b border-slate-800 text-xs font-semibold uppercase text-slate-400">
          <th onclick="sortTable('date')" class="th-sort px-3 py-3">Date <span id="sort-icon-date">↕</span></th>
          <th onclick="sortTable('vehicle')" class="th-sort px-3 py-3">Vehicle <span id="sort-icon-vehicle">↕</span></th>
          <th onclick="sortTable('driver')" class="th-sort px-3 py-3">Driver <span id="sort-icon-driver">↕</span></th>
          <th onclick="sortTable('destination')" class="th-sort px-3 py-3">Destination <span id="sort-icon-destination">↕</span></th>
          <th onclick="sortTable('distance')" class="th-sort px-3 py-3">Distance <span id="sort-icon-distance">↕</span></th>
          <th onclick="sortTable('cost')" class="th-sort px-3 py-3">Fuel Cost <span id="sort-icon-cost">↕</span></th>
        </tr>
      </thead>
      <tbody id="trips" class="divide-y divide-slate-800/60"></tbody>
    </table>
  </div>
</section>

</div>

<script src="config.js"></script>
<script>
const API_URL = window.FLEET_CONFIG?.API_URL || "";
let allTrips = [];
let sortKey = 'date';
let sortAsc = false;

function money(n){
  return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);
}

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

async function get(action){
  const r = await fetch(`${API_URL}?action=${action}`);
  return r.json();
}

async function loadDashboard(){
  try{
    const r = await get("dashboard");
    if(!r.ok) throw Error(r.message);
    render(r);
  }catch(e){
    document.querySelector("#message").innerHTML = `<div class="mb-5 rounded-2xl bg-red-950/40 border border-red-800/60 p-4 text-red-300 text-sm">${esc(e.message)}</div>`;
  }
}

function render(r){
  const s = r.summary;
  document.querySelector("#kpis").innerHTML = [
    ["Total Vehicles", s.total_vehicles],
    ["Vacant", s.vacant],
    ["Occupied", s.occupied],
    ["Trips Today", s.trips_today],
    ["Distance Today", `${s.distance_today} km`],
    ["Fuel Used Today", `${s.fuel_today} L`],
    ["Fuel Cost Today", money(s.cost_today)],
    ["Trips This Month", s.trips_month]
  ].map(x => `
    <div class="fade rounded-3xl border border-slate-800/80 bg-[#131926] p-5 shadow-xl">
      <div class="text-xs font-medium uppercase tracking-wider text-slate-400">${x[0]}</div>
      <div class="mt-2 text-2xl font-bold text-white">${x[1]}</div>
    </div>
  `).join("");

  document.querySelector("#vehicles").innerHTML = r.vehicles.map(v => `
    <div class="flex items-center justify-between rounded-2xl bg-[#0b0f17] border border-slate-800/60 p-4">
      <div>
        <div class="font-semibold text-slate-100">${esc(v.vehicle_name)}</div>
        <div class="text-xs text-slate-400">${esc(v.plate_number)} • ${v.current_odo||0} km</div>
        ${v.current_trip ? `<div class="mt-1 text-xs text-slate-400">Driver: <span class="text-slate-200">${esc(v.current_trip.driver_name)}</span> • ${esc(v.current_trip.destination)}</div>` : ""}
      </div>
      <span class="rounded-full px-3 py-1 text-xs font-bold border ${
        v.status === "Vacant" 
          ? "bg-emerald-500/10 text-emerald-400 border-emerald-500/20" 
          : "bg-amber-500/10 text-amber-400 border-amber-500/20"
      }">
        ${v.status}
      </span>
    </div>
  `).join("");

  document.querySelector("#today").innerHTML = `
    <div class="flex justify-between items-center rounded-2xl bg-[#0b0f17] border border-slate-800/60 p-4 text-sm">
      <span class="text-slate-400">Jarak tempuh</span>
      <b class="text-white">${s.distance_today} km</b>
    </div>
    <div class="flex justify-between items-center rounded-2xl bg-[#0b0f17] border border-slate-800/60 p-4 text-sm">
      <span class="text-slate-400">BBM terpakai</span>
      <b class="text-white">${s.fuel_today} L</b>
    </div>
    <div class="flex justify-between items-center rounded-2xl bg-[#0b0f17] border border-slate-800/60 p-4 text-sm">
      <span class="text-slate-400">Estimasi biaya BBM</span>
      <b class="text-emerald-400">${money(s.cost_today)}</b>
    </div>
  `;

  allTrips = r.recent_trips || [];
  filterTrips();
}

// Fungsi Sortir Kolom
function sortTable(key){
  if(sortKey === key){
    sortAsc = !sortAsc;
  } else {
    sortKey = key;
    sortAsc = true;
  }
  updateSortIcons();
  filterTrips();
}

function updateSortIcons(){
  const keys = ['date', 'vehicle', 'driver', 'destination', 'distance', 'cost'];
  keys.forEach(k => {
    const el = document.querySelector(`#sort-icon-${k}`);
    if(el){
      if(k === sortKey){
        el.textContent = sortAsc ? '▲' : '▼';
        el.className = 'text-red-400 font-bold ml-1';
      } else {
        el.textContent = '↕';
        el.className = 'text-slate-600 font-normal ml-1';
      }
    }
  });
}

function filterTrips(){
  const q = (document.querySelector("#search").value || "").toLowerCase();
  
  // 1. Filtering Search
  let filtered = allTrips.filter(t => 
    [t.vehicle_name, t.plate_number, t.driver_name, t.destination].join(" ").toLowerCase().includes(q)
  );

  // 2. Sorting Data
  filtered.sort((a, b) => {
    let valA, valB;
    switch(sortKey) {
      case 'date':
        valA = new Date(a.checkin_at || a.checkout_at || 0).getTime();
        valB = new Date(b.checkin_at || b.checkout_at || 0).getTime();
        break;
      case 'vehicle':
        valA = (a.vehicle_name || "").toLowerCase();
        valB = (b.vehicle_name || "").toLowerCase();
        break;
      case 'driver':
        valA = (a.driver_name || "").toLowerCase();
        valB = (b.driver_name || "").toLowerCase();
        break;
      case 'destination':
        valA = (a.destination || "").toLowerCase();
        valB = (b.destination || "").toLowerCase();
        break;
      case 'distance':
        valA = Number(a.distance_km) || 0;
        valB = Number(b.distance_km) || 0;
        break;
      case 'cost':
        valA = Number(a.estimated_fuel_cost) || 0;
        valB = Number(b.estimated_fuel_cost) || 0;
        break;
      default:
        valA = 0; valB = 0;
    }

    if(valA < valB) return sortAsc ? -1 : 1;
    if(valA > valB) return sortAsc ? 1 : -1;
    return 0;
  });

  // 3. Render HTML
  document.querySelector("#trips").innerHTML = filtered.map(t => `
    <tr class="hover:bg-slate-800/30 transition">
      <td class="px-3 py-3.5 whitespace-nowrap text-slate-300">${esc(t.checkin_at || t.checkout_at)}</td>
      <td class="px-3 py-3.5">
        <div class="font-medium text-slate-100">${esc(t.vehicle_name)}</div>
        <div class="text-xs text-slate-500">${esc(t.plate_number)}</div>
      </td>
      <td class="px-3 py-3.5 text-slate-200">${esc(t.driver_name)}</td>
      <td class="px-3 py-3.5 text-slate-200">${esc(t.destination)}</td>
      <td class="px-3 py-3.5 text-slate-200 font-mono">${t.distance_km} km</td>
      <td class="px-3 py-3.5 text-emerald-400 font-mono font-medium">${money(t.estimated_fuel_cost)}</td>
    </tr>
  `).join("");
}

loadDashboard();
</script>
</body>
</html>
